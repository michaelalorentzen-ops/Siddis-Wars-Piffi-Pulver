name: Technical QA and exploratory balance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check browser scripts
        run: find dist -name "*.js" -exec node --check {} \;
      - name: Technical commerce invariants
        run: npm test
      - name: Strategic mechanics
        run: npm run qa:strategy
      - name: Early progression with real starting cash
        run: npm run qa:early
      - name: Deterministic exploratory balance
        run: npm run qa:balance
      - name: Same-engine manual ownership control
        run: node qa/simulate.cjs --seeds 3 --no-ownership --output balance-manual-ownership.json
      - name: Paired ownership comparison
        run: node qa/ownership-compare.cjs
      - name: Separate inherited-mode comparison
        run: npm run qa:meta
      - name: Normal-start story and endgame smoke
        run: npm run qa:experience
      - name: Coastal story campaign smoke
        run: npm run qa:coast
      - name: Synthetic exchange stress
        run: npm run qa:exchange
      - name: Synthetic fixtures for visual reviewers
        run: npm run qa:fixtures
      - name: Publish QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-evidence
          path: qa/reports/
          if-no-files-found: warn
          retention-days: 14
